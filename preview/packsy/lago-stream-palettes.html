<script>
const palettes = [
 ['Red + Blue','Poppy red actions with cornflower blue invitation accents.','#ff626d','#260b10','#91b7ff','#202d49'],
 ['Mint + Coral','Mint actions with coral invitation accents.','#83e4c1','#092a20','#ffa38f','#3d2523'],
 ['Ice Blue + Amber','Ice blue actions with golden amber invitation accents.','#a0d4ff','#10263b','#f6c46e','#382e1d'],
 ['Apricot + Lilac','Apricot actions with lilac invitation accents.','#ffc095','#3b2012','#c9b6ff','#302640'],
 ['Citron + Periwinkle','Citron actions with periwinkle invitation accents.','#d9ed83','#292e11','#acbaff','#282d43'],
 ['Rose + Seafoam','Rose actions with seafoam invitation accents.','#f1b1d0','#3c1a30','#90dfc9','#1d3531']
];
const tokens = ['accent','ink','secondary','wash'];
const app = document.querySelector('.app');
const picker = document.querySelector('.palettes');
palettes.forEach(([name,,accent,,secondary], index)=>{
 const button=document.createElement('button');
 button.dataset.palette=index;
 const dot=document.createElement('span');
 dot.className='swatch';
 dot.style.background='linear-gradient(90deg, '+accent+' 50%, '+secondary+' 50%)';
 button.append(dot,name);
 picker.append(button);
});
function choose(index){
 const [,hint,...colors]=palettes[index];
 tokens.forEach((token,i)=>app.style.setProperty('--'+token,colors[i]));
 document.querySelector('.hint').textContent=hint+' Same near-black base across all options.';
 [...picker.children].forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
}
picker.addEventListener('click',e=>{const button=e.target.closest('button');if(button)choose(Number(button.dataset.palette));});
document.querySelector('.switch').addEventListener('click',e=>{
 const button=e.target.closest('button');
 if(!button)return;
 app.dataset.size=button.dataset.size;
 document.querySelectorAll('.switch button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
});
document.querySelector('.feed').addEventListener('click',e=>{
 const button=e.target.closest('.actions button');
 if(!button)return;
 button.closest('.actions').querySelectorAll('button').forEach(b=>{b.classList.remove('primary');b.setAttribute('aria-pressed',String(b===button));});
 button.closest('.event').querySelector('.status').textContent=button.textContent;
 const open=[...document.querySelectorAll('.status')].filter(s=>s.textContent==='Antwort offen').length;
 document.querySelector('#count').textContent=open?open+' offen':'';
});
choose(0);
</script></html>
