const photo = (e, cls) => e.photo ? `<img class="${cls}" src="${covers[e.photo]}" alt="">` : '';
const tile = e => `<span class="tile"><b>${Number(e.date.slice(8))}</b><small>${day(e.date,{month:'short'})}</small></span>`;
const controls = e => e.mine ? '' : `<div class="replies" role="group" aria-label="Antwort auf ${escapeHTML(e.title)}">${replies.map(([id,label,i])=>`<button data-action="rsvp" data-id="${e.id}" data-value="${id}" aria-pressed="${e.status===id}" class="${!e.status&&id==='go'?'default':''}">${icon(i)} ${label}</button>`).join('')}</div>`;
const card = (e, cover=false) => `<article class="event">${cover?photo(e,'cover'):''}<div class="eventbody"><div class="eventtop"><span class="host">${avatar(e.host)} ${escapeHTML(e.host)}</span>${status(e)}</div><h3><button data-action="details" data-id="${e.id}">${escapeHTML(e.title)}</button></h3>${meta(e)}${controls(e)}</div></article>`;
const row = e => `<button class="row" data-action="details" data-id="${e.id}">${photo(e,'thumb')||tile(e)}<span><strong>${escapeHTML(e.title)}</strong><small class="muted">${day(e.date,{weekday:'short',day:'numeric',month:'short'})} · ${escapeHTML(e.time)} · ${statusLabel(e)}</small></span>${icon('next')}</button>`;
const heading = (title, hint='') => `<div class="heading"><h2>${title}</h2>${hint?`<small>${hint}</small>`:''}</div>`;
const list = items => `<div class="data">${items.length ? items.map(row).join('') : '<p class="muted empty">Keine Events an diesem Tag.</p>'}</div>`;
function feed(){
  const all = ordered();
  const open = all.filter(e=>!e.mine&&!e.status);
  const count = open.length ? open.length+' offen' : '';
  if(mode===0) return heading('Übersicht',count)+`<div class="data gallery">${[...events].sort((a,b)=>b.id-a.id).map(e=>card(e,true)).join('')}</div>`;
  if(mode===1) return heading('Übersicht',count)+`<div class="layout"><div class="hero">${card(all[0],true)}</div><div><h3 class="section">Weitere Events</h3>${list(all.slice(1))}</div></div>`;
  if(mode===2) return heading('Demnächst',count)+`<div class="timeline">${all.map(e=>`<div class="line">${tile(e)}${card(e)}</div>`).join('')}</div>`;
  if(mode===3) return heading('Einladungen',count)+`<div class="filter"><button data-action="filter" data-value="pending" aria-pressed="${filter==='pending'}">Offen</button><button data-action="filter" data-value="all" aria-pressed="${filter==='all'}">Alle Events</button></div><div class="data board">${(filter==='pending'?open:all).map(e=>card(e)).join('')||'<p class="muted empty">Du hast alle Einladungen beantwortet.</p>'}</div>`;
  const days = Array.from({length:7},(_,i)=>keyOf(2026,10,23+offset*7+i));
  const active = all.filter(e=>e.date===selected);
  return heading('Wochenplan')+`<div class="eventtop"><button class="round" data-action="week" data-value="-1" aria-label="Vorherige Woche">${icon('prev')}</button><strong>${day(days[0],{day:'numeric',month:'short'})} – ${day(days[6],{day:'numeric',month:'short'})}</strong><button class="round" data-action="week" data-value="1" aria-label="Nächste Woche">${icon('next')}</button></div><div class="picker">${days.map(d=>`<button data-action="day" data-value="${d}" aria-pressed="${selected===d}"><span>${day(d,{weekday:'short'})}</span>${Number(d.slice(8))}${all.some(e=>e.date===d)?'<span aria-label="Event">•</span>':''}</button>`).join('')}</div><div class="layout"><div class="data">${active.length?active.map(e=>card(e,true)).join(''):'<p class="muted empty">Keine Events an diesem Tag.</p>'}</div><div><h3 class="section">Weitere Events</h3>${list(all.filter(e=>e.date!==selected))}</div></div>`;
}
function calendar(){
  const first = new Date(year,month,1);
  const blanks = (first.getDay()+6)%7;
  const days = Array.from({length:new Date(year,month+1,0).getDate()},(_,i)=>keyOf(year,month,i+1));
  const matching = ordered().filter(e=>calendarDay ? e.date===calendarDay : e.date.startsWith(days[0].slice(0,7)));
  return heading('Kalender')+`<div class="layout"><div><div class="eventtop"><button class="round" data-action="month" data-value="-1" aria-label="Vorheriger Monat">${icon('prev')}</button><strong>${day(days[0],{month:'long',year:'numeric'})}</strong><button class="round" data-action="month" data-value="1" aria-label="Nächster Monat">${icon('next')}</button></div><div class="grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<span class="muted">${d}</span>`).join('')}${'<span></span>'.repeat(blanks)}${days.map(d=>`<button class="day ${events.some(e=>e.date===d)?'mark':''}" data-action="calendar-day" data-value="${d}" aria-pressed="${d===calendarDay}">${Number(d.slice(8))}</button>`).join('')}</div></div><div><h3 class="section">${calendarDay?day(calendarDay,{day:'numeric',month:'long'}):'Events im Monat'}</h3>${list(matching)}</div></div>`;
}
function profileView(){
  return heading('Profil')+`<form class="form profile" id="profile-form"><div class="host">${avatar(profile.name)} ${escapeHTML(profile.name)}</div><label>Anzeigename<input name="name" value="${escapeHTML(profile.name)}" required maxlength="45"></label><fieldset><legend>Benachrichtigungen</legend><label class="check"><input type="checkbox" name="mail" ${profile.mail?'checked':''}> E-Mail</label><label class="check"><input type="checkbox" name="push" ${profile.push?'checked':''}> Push</label></fieldset><button class="pill main">Speichern</button></form>`;
}
function render(reset=false){
  $('.app').dataset.size = size;
  $('.choices').innerHTML = concepts.map(([name],i)=>`<button data-action="mode" data-value="${i}" aria-pressed="${mode===i}">${name}</button>`).join('');
  document.querySelectorAll('.sizes button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.size===size)));
  $('.caption').textContent = concepts[mode][1]+' Demo data.';
  $('.add').innerHTML = icon('plus');
  $('.dock').innerHTML = tabs.map(([id,label])=>`<button data-action="tab" data-value="${id}" ${tab===id?'aria-current="page"':''}>${icon(id)} ${label}</button>`).join('');
  const view = $('.view');
  const scroll = reset?0:view.scrollTop;
  view.innerHTML = tab==='feed'?feed():tab==='calendar'?calendar():profileView();
  view.scrollTop=scroll;
}
const dialog = $('dialog');
const dialogHeader = title => `<div class="top"><h2 id="dialog-title">${escapeHTML(title)}</h2><button type="button" class="round" data-action="close" aria-label="Schliessen">${icon('close')}</button></div>`;
function details(e){
  detailId = e.id;
  const guests = e.guests.map((name,i)=>`<div class="guest"><span>${avatar(name)}${escapeHTML(name)}</span><small class="muted">${i===0?'Dabei':'Antwort offen'}</small></div>`).join('');
  dialog.innerHTML = dialogHeader(e.title)+photo(e,'cover')+`<div class="eventtop"><span class="host">${avatar(e.host)} ${escapeHTML(e.host)}</span>${status(e)}</div>`+meta(e)+(e.note?`<p>${escapeHTML(e.note)}</p>`:'')+`<h3 class="section">Gäste</h3>${guests}`+controls(e);
  if(!dialog.open) dialog.showModal();
}
function create(){
  detailId = null;
  dialog.innerHTML = dialogHeader('Neuer Event')+`<form class="form" id="event-form"><label>Titel<input name="title" maxlength="75" required></label><div class="split"><label>Datum<input type="date" name="date" value="2026-11-28" required></label><label>Zeit<input type="time" name="time" value="18:00" required></label></div><label>Ort<input name="place" maxlength="75"></label><label>Notizen<textarea name="note" maxlength="350" rows="2"></textarea></label><fieldset><legend>Einladen</legend>${['Lago Nostre','Lago Plus','Mia Keller','Jonas Frei','Lea Rossi','Noah Meier'].map(n=>`<label class="check"><input type="checkbox" name="guest" value="${n}"> ${n}</label>`).join('')}</fieldset><button class="pill main">Event erstellen</button></form>`;
  dialog.showModal();
}
function announce(text){
  clearTimeout(timer);
  $('.notice').textContent=text;
  timer=setTimeout(()=>$('.notice').textContent='',2300);
}
function focusControl(data){
  const {action,value,id}=data;
  [...document.querySelectorAll('button[data-action]')].find(b=>b.dataset.action===action&&b.dataset.value===value&&b.dataset.id===id)?.focus({preventScroll:true});
}
document.addEventListener('click', event=>{
  const button=event.target.closest('button');
  if(!button)return;
  if(button.closest('.sizes')){size=button.dataset.size;render();return;}
  const {action,value,id}=button.dataset, e=events.find(e=>e.id===Number(id));
  if(action==='details'){details(e);return;}
  if(action==='create'){create();return;}
  if(action==='close'){dialog.close();return;}
  if(action==='rsvp'){
    e.status=value;
    render();
    if(dialog.open&&detailId===e.id){
      details(e);
      dialog.querySelector('[data-value="'+value+'"]').focus();
    }else focusControl(button.dataset);
    announce('Antwort gespeichert');return;
  }
  if(action==='mode'){mode=Number(value);tab='feed';}
  if(action==='tab')tab=value;
  if(action==='filter')filter=value;
  if(action==='day')selected=value;
  if(action==='week'){offset+=Number(value);selected=keyOf(2026,10,23+offset*7);}
  if(action==='calendar-day')calendarDay=calendarDay===value?'':value;
  if(action==='month'){const next=new Date(year,month+Number(value),1);month=next.getMonth();year=next.getFullYear();calendarDay='';}
  if(action){render(action==='mode'||action==='tab');focusControl(button.dataset);}
});
document.addEventListener('submit', event=>{
  event.preventDefault();
  const form=new FormData(event.target);
  if(event.target.id==='event-form'){
    events.push({id:Date.now(),title:form.get('title'),host:profile.name,date:form.get('date'),time:form.get('time'),place:form.get('place'),note:form.get('note'),guests:form.getAll('guest'),mine:true,status:''});
    dialog.close();tab='feed';mode=0;render(true);announce('Event erstellt');
  }
  if(event.target.id==='profile-form'){
    profile.name=form.get('name').trim()||profile.name;
    profile.mail=form.has('mail');profile.push=form.has('push');
    render();announce('Profil gespeichert');
  }
});
render();
</script>
</body>
</html>
