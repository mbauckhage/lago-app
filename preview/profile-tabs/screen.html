<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil</title>
<div id="app" class="mx-auto h-dvh max-w-[960px] px-5 py-8"></div>
<style>
.folder [role=tablist] { gap: 2px }
.folder [role=tab] { padding-inline: 16px; border: 1px solid transparent; border-radius: 8px 8px 0 0 }
.folder [role=tab][aria-selected=true] { border-color: var(--color-line); border-bottom-color: var(--color-panel); background: var(--color-panel) }
.folder [role=tabpanel] { background: var(--color-panel); padding: 1px 12px 12px }
.rail section > :last-child { display: grid; grid-template-columns: minmax(78px, 22%) 1fr; align-content: start; column-gap: 12px }

.rail [role=tablist] { flex-direction: column; gap: 0; align-self: start; border: 0 }
.rail [role=tab] { border: 0; border-inline-start: 3px solid transparent; text-align: left; padding-inline: 8px }
.rail [aria-selected=true] { border-inline-start-color: var(--color-brand) }
.rail [role=tabpanel] > p:first-child { margin-top: 0 }
.split [role=tablist] { gap: 0; border-block: 1px solid var(--color-line) }
.split [role=tab] { flex: 1; margin: 0; border: 0 }
.split [aria-selected=true] { background: var(--color-panel); box-shadow: inset 0 3px var(--color-brand) }
.index [role=tablist] { border: 0; gap: 1rem; align-items: baseline }
.index [role=tab] { flex: none; border: 0; padding: 0 }
.index [aria-selected=true] { font-size: clamp(20px, 4vw, 28px); font-weight: 700; text-decoration: underline; text-decoration-color: var(--color-brand); text-underline-offset: 7px }
</style>
<script type="module" src="./screen.js"></script></html>
