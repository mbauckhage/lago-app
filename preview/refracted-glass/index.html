<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lago · Refracted glass</title>
<link rel="stylesheet" href="style.css">
<script src="photos.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main class="studio">
  <div class="mast"><h1>Refracted glass</h1><span>Lago design study</span></div>
  <div class="toolbar">
    <div class="options" role="group" aria-label="Design option"></div>
    <div class="sizes" role="group" aria-label="Preview size">
      <button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="mobile" aria-pressed="false">Mobile</button>
    </div>
  </div>
  <p class="caption" aria-live="polite"></p>
  <div class="viewport"><section class="lago" aria-label="Lago feed preview"></section></div>
</main>
</body>
</html>
