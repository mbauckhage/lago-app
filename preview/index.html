<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9ece6">
<title>Lago · Mobile concepts</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main class="stage">
  <aside class="chooser">
    <div class="labmark"><span class="mark" data-icon="waves"></span> Lago</div>
    <h1>One group.<br>Five ways to make plans.</h1>
    <p>Explore the same invitations in five mobile designs.</p>
    <div id="options" role="group" aria-label="Design options"></div>
  </aside>
  <section class="phone" id="phone" aria-label="Lago mobile preview">
    <header id="header"></header>
    <div id="screen" class="screen" tabindex="-1"></div>
    <nav id="nav" aria-label="Lago tabs"></nav>
    <dialog id="dialog"></dialog>
    <div id="notice" role="status"></div>
  </section>
</main>
</body>
</html>
